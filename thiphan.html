<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thị phần — OPPO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  :root{
    --bg:#0E1826; --panel:#142235; --panel-alt:#182A42; --border:rgba(255,255,255,0.08);
    --gold:#E4A73B; --teal:#33B6A4; --red:#E2574C; --text:#EAF0F6; --muted:#8DA0B5;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1180px;margin:0 auto;padding:36px 24px 80px;}

  header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:16px;margin-bottom:24px;}
  .titleblock h1{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:28px;margin:0 0 6px;letter-spacing:-0.01em;}
  .titleblock p{margin:0;color:var(--muted);font-size:13.5px;}
  .syncbox{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:9px 14px;font-size:12.5px;color:var(--muted);white-space:nowrap;}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--teal);flex:none;}
  .dot.off{background:var(--red);}
  #refreshBtn{background:none;border:1px solid var(--border);color:var(--text);border-radius:8px;padding:6px 10px;font-size:12.5px;cursor:pointer;}
  #refreshBtn:hover{background:var(--panel-alt);}

  .filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px;align-items:center;}
  .filters select,.filters input{background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:9px 12px;font-size:13px;font-family:inherit;}
  .filters input{flex:1;min-width:180px;}
  .filters select{min-width:160px;}
  .filters .flabel{font-size:11.5px;color:var(--muted);display:block;margin-bottom:4px;}
  .fgroup{display:flex;flex-direction:column;}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:22px;}
  .stat{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px;}
  .stat .label{font-size:12.5px;color:var(--muted);margin-bottom:8px;}
  .stat .value{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:600;}
  .stat.gold .value{color:var(--gold);}
  .stat.teal .value{color:var(--teal);}

  .panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:20px;}
  .panel h2{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:600;margin:0 0 16px;}

  table.data{width:100%;border-collapse:collapse;font-size:13px;background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
  table.data th,table.data td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap;}
  table.data th{color:var(--muted);font-weight:500;font-size:11.5px;cursor:pointer;user-select:none;}
  table.data th:hover{color:var(--text);}
  table.data tbody tr:last-child td{border-bottom:none;}
  table.data tbody tr:hover{background:var(--panel-alt);}
  table.data td.num{text-align:right;}
  .badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600;}
  .progress-cell{display:flex;align-items:center;gap:8px;min-width:110px;}
  .progress-track{flex:1;height:6px;border-radius:3px;background:var(--panel-alt);overflow:hidden;}
  .progress-fill{height:100%;border-radius:3px;}
  .empty{padding:36px;text-align:center;color:var(--muted);font-size:13.5px;}

  footer{margin-top:24px;font-size:12px;color:var(--muted);text-align:center;}
  footer a{color:var(--teal);}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="titleblock">
      <h1>Thị phần theo shop</h1>
      <p>OPPO · so sánh thị phần theo hãng, shop và phân khúc giá</p>
    </div>
    <div class="syncbox">
      <span class="dot" id="syncDot"></span>
      <span id="syncText">Đang đồng bộ…</span>
      <button id="refreshBtn" onclick="loadData()">Làm mới</button>
    </div>
  </header>

  <div class="filters">
    <div class="fgroup"><span class="flabel">Phân khúc giá</span><select id="segmentFilter"></select></div>
    <div class="fgroup"><span class="flabel">Hãng</span><select id="brandFilter"><option value="">Tất cả hãng</option></select></div>
    <div class="fgroup" style="flex:1;"><span class="flabel">Tên shop</span><input type="text" id="shopSearch" placeholder="Tìm theo tên shop..."></div>
  </div>

  <div class="stats" id="statsRow"></div>

  <div class="panel">
    <h2 id="chartTitle">Số máy bán theo hãng</h2>
    <div style="position:relative;height:360px;">
      <canvas id="mainChart" role="img" aria-label="Biểu đồ thị phần"></canvas>
    </div>
  </div>

  <div class="panel">
    <h2>Chi tiết theo shop</h2>
    <div style="overflow-x:auto;">
      <table class="data" id="dataTable">
        <thead><tr id="tableHead"></tr></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

  <footer id="footerNote">Nguồn: Google Sheet "DOANH THU OPPO" — sheet THỊ PHẦN</footer>
</div>

<script>
const SHEET_ID = '1_YZWAtEIbZ-dHAoO20vuVX0BuI23kKO_7QmIzxFVpSo';
const SHEET_NAME = 'THỊ PHẦN';
const BRANDS = ['OPPO','SAMSUNG','VIVO','REALME','XIAOMI','IPHONE','OTHER'];
const BRAND_COLORS = {OPPO:'#33B6A4', SAMSUNG:'#4C9BE8', VIVO:'#E4A73B', REALME:'#E2574C', XIAOMI:'#F2C744', IPHONE:'#8B7CD8', OTHER:'#8DA0B5'};

const FALLBACK_TP = {
  'TỔNG THỊ TRƯỜNG': [
    {shop:'AAR_TNI_TBA - 10 Quốc Lộ 22 (Trảng Bàng)', counts:[0,0,0,0,0,173,0], total:173, pct:[0,0,0,0,0,1,0]},
    {shop:'TGD_TNI_GDA - Phước Đông', counts:[40,47,12,11,20,24,14], total:168, pct:[0.24,0.28,0.07,0.07,0.12,0.14,0.08]},
    {shop:'TGD_TNI_TBA - 145 Quốc Lộ 22', counts:[152,183,61,28,103,108,18], total:653, pct:[0.23,0.28,0.09,0.04,0.16,0.17,0.03]},
    {shop:'TGD_TNI_TBA - 180 Quốc Lộ 22', counts:[29,25,6,4,17,18,5], total:104, pct:[0.28,0.24,0.06,0.04,0.16,0.17,0.05]},
    {shop:'TGD_TNI_TBA - 3435 Quốc Lộ 22 (An Tịnh)', counts:[22,33,6,11,12,26,28], total:138, pct:[0.16,0.24,0.04,0.08,0.09,0.19,0.20]},
    {shop:'ĐML_TNI_TBA - 10 Quốc Lộ 22 (Trảng Bàng)', counts:[25,85,11,12,75,0,6], total:214, pct:[0.12,0.40,0.05,0.06,0.35,0,0.03]},
    {shop:'ĐMM_TNI_GDA - Phước Đức A (Phước Đông)', counts:[57,68,11,13,79,34,14], total:276, pct:[0.21,0.25,0.04,0.05,0.29,0.12,0.05]},
    {shop:'ĐMM_TNI_GDA - Phước Đức B (Phước Đông)', counts:[14,16,15,16,22,25,3], total:111, pct:[0.13,0.14,0.14,0.14,0.20,0.23,0.03]},
    {shop:'ĐMM_TNI_TBA - An Tịnh', counts:[25,20,13,3,24,8,4], total:97, pct:[0.26,0.21,0.13,0.03,0.25,0.08,0.04]},
    {shop:'ĐMS_TNI_GDA - Bàu Đồn (Đường ĐT782)', counts:[9,16,11,2,12,8,8], total:66, pct:[0.14,0.24,0.17,0.03,0.18,0.12,0.12]},
    {shop:'ĐMS_TNI_TBA - 387 ĐT787B', counts:[12,14,4,0,9,1,0], total:40, pct:[0.30,0.35,0.10,0,0.23,0.03,0]},
    {shop:'ĐMS_TNI_TBA - An Hòa', counts:[29,18,14,20,11,19,2], total:113, pct:[0.26,0.16,0.12,0.18,0.10,0.17,0.02]}
  ]
};

let TP_SEGMENTS = FALLBACK_TP;
let chartInstance = null;

function fmt(n){ return Math.round(n).toLocaleString('vi-VN'); }
function fmtPct(n){ return (Math.round(n*1000)/10) + '%'; }

function fillSegmentFilter(){
  const sel = document.getElementById('segmentFilter');
  const names = Object.keys(TP_SEGMENTS);
  const cur = sel.value;
  sel.innerHTML = names.map(s=>`<option value="${s}">${s}</option>`).join('');
  if(names.includes(cur)) sel.value = cur;
}

function render(){
  fillSegmentFilter();
  const seg = document.getElementById('segmentFilter').value || Object.keys(TP_SEGMENTS)[0];
  const brand = document.getElementById('brandFilter').value; // '' = tất cả
  const q = document.getElementById('shopSearch').value.trim().toLowerCase();

  const allRows = TP_SEGMENTS[seg] || [];
  const rows = allRows.filter(r=> !q || r.shop.toLowerCase().includes(q));

  if(!brand){
    // ---- Tất cả hãng ----
    const brandTotals = BRANDS.map((b,i)=> rows.reduce((s,r)=>s+(r.counts[i]||0),0));
    const grandTotal = brandTotals.reduce((a,b)=>a+b,0);
    const topIdx = brandTotals.indexOf(Math.max(...brandTotals));

    document.getElementById('statsRow').innerHTML = `
      <div class="stat gold"><div class="label">Tổng máy bán</div><div class="value">${fmt(grandTotal)} máy</div></div>
      <div class="stat teal"><div class="label">Hãng dẫn đầu</div><div class="value">${grandTotal? BRANDS[topIdx]+' · '+fmtPct(brandTotals[topIdx]/grandTotal) : '—'}</div></div>
      <div class="stat"><div class="label">Số shop</div><div class="value">${rows.length}</div></div>
    `;

    document.getElementById('chartTitle').textContent = 'Tổng số máy bán theo hãng — ' + seg;
    if(chartInstance) chartInstance.destroy();
    chartInstance = new Chart(document.getElementById('mainChart'), {
      type:'bar',
      data:{ labels:BRANDS, datasets:[{ data:brandTotals, backgroundColor:BRANDS.map(b=>BRAND_COLORS[b]), borderRadius:4 }] },
      options:{
        responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{display:false}, tooltip:{callbacks:{label:(c)=> fmt(c.parsed.y) + ' máy'}} },
        scales:{ x:{ ticks:{color:'#8DA0B5'}, grid:{display:false} }, y:{ ticks:{color:'#8DA0B5'}, grid:{color:'rgba(255,255,255,0.06)'}, beginAtZero:true } }
      }
    });

    document.getElementById('tableHead').innerHTML = `<th>Shop</th>` + BRANDS.map(b=>`<th class="num">${b}</th>`).join('') + `<th class="num">Total</th>` + BRANDS.map(b=>`<th class="num">%${b}</th>`).join('');
    const body = document.getElementById('tableBody');
    if(rows.length===0){
      body.innerHTML = `<tr><td colspan="${BRANDS.length*2+2}"><div class="empty">Không có shop phù hợp.</div></td></tr>`;
    } else {
      body.innerHTML = rows.map(r=>`
        <tr>
          <td>${r.shop}</td>
          ${r.counts.map(c=>`<td class="num">${fmt(c)}</td>`).join('')}
          <td class="num">${fmt(r.total)}</td>
          ${r.pct.map(p=>`<td class="num">${fmtPct(p)}</td>`).join('')}
        </tr>
      `).join('');
    }

  } else {
    // ---- Hãng cụ thể ----
    const idx = BRANDS.indexOf(brand);
    const enriched = rows.map(r=>({ shop:r.shop, count:r.counts[idx]||0, pct:r.pct[idx]||0, total:r.total }))
                          .sort((a,b)=>b.pct-a.pct);
    const brandTotal = enriched.reduce((s,r)=>s+r.count,0);
    const marketTotal = rows.reduce((s,r)=>s+r.total,0);
    const topShop = enriched[0];

    document.getElementById('statsRow').innerHTML = `
      <div class="stat gold"><div class="label">Tổng máy ${brand} bán</div><div class="value">${fmt(brandTotal)} máy</div></div>
      <div class="stat teal"><div class="label">Thị phần ${brand} chung</div><div class="value">${marketTotal? fmtPct(brandTotal/marketTotal):'0%'}</div></div>
      <div class="stat"><div class="label">Shop dẫn đầu (${brand})</div><div class="value" style="font-size:15px;">${topShop? topShop.shop.split(' - ')[0] + ' · ' + fmtPct(topShop.pct) : '—'}</div></div>
    `;

    document.getElementById('chartTitle').textContent = `Thị phần ${brand} theo shop — ${seg}`;
    if(chartInstance) chartInstance.destroy();
    chartInstance = new Chart(document.getElementById('mainChart'), {
      type:'bar',
      data:{
        labels: enriched.map(r=>r.shop),
        datasets:[{ data: enriched.map(r=>Math.round(r.pct*1000)/10), backgroundColor: BRAND_COLORS[brand] || '#33B6A4', borderRadius:4, maxBarThickness:18 }]
      },
      options:{
        indexAxis:'y', responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{display:false}, tooltip:{callbacks:{label:(c)=> c.parsed.x + '%'}} },
        scales:{
          x:{ min:0, ticks:{color:'#8DA0B5', callback:(v)=>v+'%'}, grid:{color:'rgba(255,255,255,0.06)'} },
          y:{ ticks:{color:'#8DA0B5'}, grid:{display:false} }
        }
      }
    });

    document.getElementById('tableHead').innerHTML = `<th>Shop</th><th class="num">Số lượng ${brand}</th><th>% thị phần ${brand}</th><th class="num">Tổng máy bán (shop)</th>`;
    const body = document.getElementById('tableBody');
    if(enriched.length===0){
      body.innerHTML = `<tr><td colspan="4"><div class="empty">Không có shop phù hợp.</div></td></tr>`;
    } else {
      body.innerHTML = enriched.map(r=>`
        <tr>
          <td>${r.shop}</td>
          <td class="num">${fmt(r.count)}</td>
          <td>
            <div class="progress-cell">
              <div class="progress-track"><div class="progress-fill" style="width:${Math.min(r.pct*100,100)}%;background:${BRAND_COLORS[brand]}"></div></div>
              <span>${fmtPct(r.pct)}</span>
            </div>
          </td>
          <td class="num">${fmt(r.total)}</td>
        </tr>
      `).join('');
    }
  }
}

document.getElementById('segmentFilter').addEventListener('change', render);
document.getElementById('brandFilter').addEventListener('change', render);
document.getElementById('shopSearch').addEventListener('input', render);

function parseThiPhan(json){
  const rows = json.table.rows;
  const cell = (row, idx) => (row.c && row.c[idx]) ? row.c[idx] : null;
  const segments = {};
  let currentSeg = null;

  for(let i=0;i<rows.length;i++){
    const r = rows[i];
    const c0 = cell(r,0);
    const c1 = cell(r,1);
    if(!c0 || c0.v === null || c0.v === undefined || String(c0.v).trim()==='') continue;
    const label = String(c0.v).trim();

    if(c1 && typeof c1.v === 'number'){
      if(!currentSeg) continue;
      const counts = [];
      for(let k=1;k<=7;k++){ const c = cell(r,k); counts.push(c && typeof c.v==='number' ? c.v : 0); }
      const totalC = cell(r,8);
      const total = totalC && typeof totalC.v==='number' ? totalC.v : counts.reduce((a,b)=>a+b,0);
      const pct = [];
      for(let k=9;k<=15;k++){ const c = cell(r,k); pct.push(c && typeof c.v==='number' ? c.v : 0); }
      segments[currentSeg].push({shop:label, counts, total, pct});
    } else {
      currentSeg = label;
      if(!segments[currentSeg]) segments[currentSeg] = [];
    }
  }
  Object.keys(segments).forEach(k=>{ if(segments[k].length===0) delete segments[k]; });
  if(Object.keys(segments).length===0) throw new Error('Không đọc được dữ liệu Thị Phần');
  return segments;
}

let jsonpCounter = 0;
function loadData(){
  document.getElementById('syncDot').classList.remove('off');
  document.getElementById('syncText').textContent = 'Đang đồng bộ…';

  const cbName = 'sheetCb_' + (jsonpCounter++);
  const timeout = setTimeout(()=>{ handleFail('Hết thời gian chờ phản hồi từ Google Sheet.'); }, 15000);

  window[cbName] = function(json){
    clearTimeout(timeout);
    try{
      if(json.status === 'error') throw new Error('Sheet trả về lỗi — kiểm tra quyền chia sẻ.');
      TP_SEGMENTS = parseThiPhan(json);
      document.getElementById('syncDot').classList.remove('off');
      document.getElementById('syncText').textContent = 'Đã đồng bộ trực tiếp';
      document.getElementById('footerNote').innerHTML =
        `Đồng bộ trực tiếp từ Google Sheet · cập nhật lúc ${new Date().toLocaleTimeString('vi-VN')} · <a href="https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit" target="_blank" rel="noopener">Mở Sheet để chỉnh sửa ↗</a>`;
      render();
    }catch(e){
      handleFail(e.message);
    }
    delete window[cbName];
    script.remove();
  };

  const script = document.createElement('script');
  script.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?sheet=${encodeURIComponent(SHEET_NAME)}&tqx=out:json;responseHandler:${cbName}&t=${Date.now()}`;
  script.onerror = ()=>{ clearTimeout(timeout); handleFail('Không thể kết nối tới Google Sheet.'); };
  document.body.appendChild(script);
}

function handleFail(msg){
  document.getElementById('syncDot').classList.add('off');
  document.getElementById('syncText').textContent = 'Dùng dữ liệu mẫu (chưa đồng bộ)';
  document.getElementById('footerNote').innerHTML =
    `${msg} Kiểm tra tên tab trong Sheet có đúng là "THỊ PHẦN" không, và Sheet đã bật chia sẻ "Anyone with the link". <a href="https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit" target="_blank" rel="noopener">Mở Sheet ↗</a>`;
  TP_SEGMENTS = FALLBACK_TP;
  render();
}

render();
loadData();
</script>
</body>
</html>
